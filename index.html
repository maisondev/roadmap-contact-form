<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>

    <form action="https://example.com/contact" method="post">
        <!-- Full Name -->
        <div>
            <label for="fullname">Full Name <span>*</span></label>
            <input type="text" id="fullname" name="fullname" required>
        </div>

        <!-- Email -->
        <div>
            <label for="email">Email <span>*</span></label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Subject -->
        <div>
            <label for="subject">Subject <span>*</span></label>
            <select id="subject" name="subject" required>
                <option value="">-- Select a subject --</option>
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="feedback">Feedback</option>
            </select>
        </div>

        <!-- Message -->
        <div>
            <label for="message">Message <span>*</span></label>
            <textarea id="message" name="message" minlength="10" required></textarea>
        </div>

        <!-- How did you hear about us -->
        <fieldset>
            <legend>How did you hear about us? <span>*</span></legend>
            <div>
                <input type="radio" id="heard-search" name="heard-about" value="search" required>
                <label for="heard-search">Search Engine</label>
            </div>
            <div>
                <input type="radio" id="heard-social" name="heard-about" value="social" required>
                <label for="heard-social">Social Media</label>
            </div>
            <div>
                <input type="radio" id="heard-referral" name="heard-about" value="referral" required>
                <label for="heard-referral">Friend Referral</label>
            </div>
        </fieldset>

        <!-- Newsletter -->
        <div>
            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
            <label for="newsletter">Subscribe to our newsletter</label>
        </div>

        <!-- Submit Button -->
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
